version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"    # HTTP
      - "443:443"  # HTTPS
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Mount the nginx.conf file
    networks:
      - devops-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backend:
    image: ahmeddihe/devops-end-to-end-backend:latest
    ports:
      - "5000:5000"
    networks:
      - devops-network
    environment:
      DATABASE_URL: mysql://root:rootpassword@db:3306/mydatabase
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  frontend:
    image: ahmeddihe/devops-end-to-end-frontend:latest
    ports:
      - "3000:3000"
    networks:
      - devops-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  db:
    image: mysql:5.7
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - devops-network
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  db_data:

networks:
  devops-network:
    driver: overlay

